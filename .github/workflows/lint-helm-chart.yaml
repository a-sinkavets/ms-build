name: Lint Helm Chart

on:
  push:
    branches:
      - develop
    paths:
      - charts/**
  pull_request:
    branches:
      - main
    paths:
      - charts/**
  workflow_dispatch:

jobs:
  lint-helm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint ./charts

      - name: Run chart tests
        run: bash ./charts/tests/run.sh
