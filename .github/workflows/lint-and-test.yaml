name: Lint and Test

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
  # for tests
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Lint with flake8
        run: |
          echo "## Lint Results" >> $GITHUB_STEP_SUMMARY
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics > lint_output.txt 2>&1 || true
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics >> lint_output.txt 2>&1
          if [ -s lint_output.txt ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat lint_output.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No linting issues found" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Run tests
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          pytest -v --tb=short --junit-xml=pytest-report.xml 2>&1 | tee test_output.txt || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat test_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
      
      - name: Run tests verbose on failure
        if: failure()
        run: |
          echo "## Detailed Test Results (Failure)" >> $GITHUB_STEP_SUMMARY
          pytest -vv --tb=long 2>&1 | tee detailed_test_output.txt || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat detailed_test_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY