name: Lint and Test

on:
  push:
    branches:
      - develop
    paths-ignore:
      - charts/**
  pull_request:
    branches:
      - main
    paths-ignore:
      - charts/**
  # for tests
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies for linting
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Lint with flake8
        run: |
          echo "Running flake8 linting..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exit-zero > lint_output.txt
          ERROR_COUNT=$(tail -n 1 lint_output.txt | grep -oP '^\d+' || echo "0")
          echo "Total errors found: $ERROR_COUNT"
          echo "## Lint Results" >> $GITHUB_STEP_SUMMARY
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "❌ Found $ERROR_COUNT linting error(s)" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat lint_output.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No linting issues found" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Install dependencies for testing
        run: |
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      
      - name: Run tests
        run: |
          echo "Running pytest with verbose output..."
          pytest -vv --tb=short --junit-xml=pytest-report.xml | tee test_output.txt || true
          PASSED=$(grep -oP '\d+(?= passed)' test_output.txt || echo "0")
          FAILED=$(grep -oP '\d+(?= failed)' test_output.txt || echo "0")
          echo "Test summary: Passed=$PASSED, Failed=$FAILED"
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed: $PASSED | ❌ Failed: $FAILED" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
      
      - name: Run tests verbose on failure
        if: failure()
        run: |
          echo "Re-running tests with maximum verbosity..."
          pytest -vv --tb=long | tee detailed_test_output.txt || true
          echo "## Detailed Test Results (Failure)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat detailed_test_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
